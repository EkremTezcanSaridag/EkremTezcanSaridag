name: Interactive Profile Chess

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: profile-chess
  cancel-in-progress: false

jobs:
  play-move:
    if: startsWith(github.event.issue.title, 'chess|')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install python-chess
        run: pip install --quiet chess

      - name: Process chess move
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: python3 scripts/chess_engine.py --issue-title "$ISSUE_TITLE" --player "$ISSUE_AUTHOR" --output-file chess_result.json

      - name: Commit and push updated board
        run: |
          OK=$(python3 -c 'import json; print(json.load(open("chess_result.json")).get("ok", False))')
          if [ "$OK" = "True" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add game/state.json assets/chessboard.svg README.md
            if ! git diff --cached --quiet; then
              git commit -m "chess: ${{ github.event.issue.title }} by @${{ github.event.issue.user.login }}"
              git push
            fi
          fi

      - name: Reply and close issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('chess_result.json', 'utf8'));
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: result.message
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
