<svg xmlns="http://www.w3.org/2000/svg" width="800" height="128" viewBox="0 0 800 128" role="img" aria-label="Ekrem Tezcan Sarıdağ - Frontend Developer">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E14"/>
      <stop offset="55%" stop-color="#131824"/>
      <stop offset="100%" stop-color="#0B0E14"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2C6"/>
      <stop offset="45%" stop-color="#DFB951"/>
      <stop offset="100%" stop-color="#8F6A14"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="100%" stop-color="#E8D5A3"/>
    </linearGradient>
    <pattern id="checker" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#D4AF37" fill-opacity="0.035"/>
      <rect x="16" y="16" width="16" height="16" fill="#D4AF37" fill-opacity="0.035"/>
    </pattern>
    <radialGradient id="glow" cx="10%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip">
      <rect x="1" y="1" width="798" height="126" rx="14"/>
    </clipPath>
    <style>
      .name {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 1.2px;
        fill: url(#nameGrad);
      }
      .role {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-size: 13.5px;
        font-weight: 500;
        letter-spacing: 2.2px;
        fill: #C4AA67;
      }
      .tag {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        font-size: 11px;
        fill: #8E98AB;
        letter-spacing: 1px;
      }
    </style>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="800" height="128" fill="url(#bg)"/>
    <rect x="520" y="0" width="280" height="128" fill="url(#checker)"/>
    <rect width="800" height="128" fill="url(#glow)"/>
  </g>

  <rect x="1" y="1" width="798" height="126" rx="14" fill="none" stroke="#D4AF37" stroke-opacity="0.34" stroke-width="1.2"/>

  <!-- Left Golden Knight Emblem -->
  <g transform="translate(36, 30)">
    <circle cx="34" cy="34" r="32" fill="#141925" stroke="#D4AF37" stroke-opacity="0.45" stroke-width="1.2"/>
    <g transform="translate(11, 10) scale(1.05)">
      <path d="M13 37 H32 V33.5 H13 Z" fill="url(#gold)"/>
      <path d="M15.5 33.5 C16 27 19 24 22 21.5 C19 21.5 16 22.5 13.5 23.5 C12 24 10.8 22.8 11.2 21.2 C12 18.5 14.5 15.5 17 13.4 C17.3 11.2 18.4 9.2 20.3 7.8 L21.2 10.6 C24.4 10.4 28.2 12.2 30 16.2 C31.6 19.8 31.4 26.2 30.4 33.5 Z" fill="url(#gold)"/>
      <circle cx="17.5" cy="15.8" r="1.2" fill="#0E1118"/>
    </g>
  </g>

  <!-- Name & Role -->
  <text x="128" y="61" class="name">EKREM TEZCAN SARIDAĞ</text>
  <text x="129" y="88" class="role">FRONTEND DEVELOPER</text>

  <!-- Minimal Chess Coordinates Right -->
  <text x="764" y="69" text-anchor="end" class="tag">e2 → e4</text>
</svg>
